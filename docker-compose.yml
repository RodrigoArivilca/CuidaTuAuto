# OPCIONAL: el modo inicial usa PGlite y no necesita Docker.
# Las credenciales de este archivo son SOLO para desarrollo local.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cuidatuauto
      POSTGRES_USER: cuidatuauto
      POSTGRES_PASSWORD: cuidatuauto_demo_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cuidatuauto_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuidatuauto -d cuidatuauto"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  cuidatuauto_postgres:
